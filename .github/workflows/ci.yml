name: CI

# Typecheck and build both workspaces on every push and pull request.
# Hosting is configured separately — see docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
